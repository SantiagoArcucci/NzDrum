name: Release

# Pushing a tag like v0.1.0 builds the plugin and publishes a GitHub Release
# with a zip of the VST3. Pull requests that touch the release files run the
# same steps without publishing, so the packaging is tested before a tag.
on:
  push:
    tags: ['v*']
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - CHANGELOG.md

permissions:
  contents: write   # to create the release

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Read the version
        id: version
        run: |
          version=$(sed -nE 's/^project\(NzDrum VERSION ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p' CMakeLists.txt)
          if [ -z "$version" ]; then echo "No version found in CMakeLists.txt"; exit 1; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Check that the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match the version in CMakeLists.txt (v${{ steps.version.outputs.version }})"
            exit 1
          fi

      - name: Extract the release notes from CHANGELOG.md
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "CHANGELOG.md has no section for ${{ steps.version.outputs.version }}"
            exit 1
          fi
          cat release-notes.md

      - name: Configure (universal arm64 + x86_64 binary)
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          -DNZDRUM_COPY_AFTER_BUILD=OFF

      - name: Build VST3 and tests
        run: cmake --build build --target NzDrum_VST3 NzDrumTests --parallel 4

      - name: Run engine tests
        run: ./build/NzDrumTests_artefacts/Release/NzDrumTests

      # Without an Apple Developer account the plugin can't be signed with an
      # identity or notarized. An ad-hoc signature at least seals the whole
      # bundle, so a damaged download is detected.
      - name: Ad-hoc sign the bundle
        run: |
          codesign --force --deep --sign - build/NzDrum_artefacts/Release/VST3/NzDrum.vst3
          codesign --verify --deep --strict --verbose=2 build/NzDrum_artefacts/Release/VST3/NzDrum.vst3

      - name: Validate with pluginval
        run: |
          curl -sSL -o pluginval.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval \
            --strictness-level 5 \
            --validate-in-process \
            --skip-gui-tests \
            --validate build/NzDrum_artefacts/Release/VST3/NzDrum.vst3

      - name: Package the zip
        id: package
        run: |
          name="NzDrum-${{ steps.version.outputs.version }}-macOS"
          mkdir -p "dist/$name"
          cp -R build/NzDrum_artefacts/Release/VST3/NzDrum.vst3 "dist/$name/"
          cp packaging/INSTALL.txt LICENSE "dist/$name/"
          # ditto keeps the bundle intact (symlinks, permissions, signature).
          (cd dist && ditto -c -k --keepParent "$name" "$name.zip")
          echo "zip=dist/$name.zip" >> "$GITHUB_OUTPUT"

      - name: Upload the zip (pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: NzDrum-release-preview
          path: ${{ steps.package.outputs.zip }}

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" "${{ steps.package.outputs.zip }}"
          --title "NzDrum ${{ steps.version.outputs.version }}"
          --notes-file release-notes.md
